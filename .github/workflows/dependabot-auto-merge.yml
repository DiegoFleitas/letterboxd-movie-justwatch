# Human-gated auto-merge for Dependabot PRs.
# Enables GitHub-native auto-merge but does NOT auto-approve.
# The merge only happens after a human approves the PR (branch protection
# ruleset on the default branch requires 1 approving review).
# Until that ruleset exists, the PR simply waits for a human.

name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    # Only runs for Dependabot PRs from the same repo (not forks),
    # which mitigates pull_request_target spoofing concerns.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash)
        # Repository setting `allow_auto_merge` is currently off and master has
        # no ruleset requiring an approving review, so this is a no-op today.
        # Keep the check green instead of failing every Dependabot PR on it.
        continue-on-error: true
        run: |
          gh pr merge --auto --squash "$PR_URL" ||
            echo "auto-merge unavailable: enable allow_auto_merge and a review ruleset, then merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
