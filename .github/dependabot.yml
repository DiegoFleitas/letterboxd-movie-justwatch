# Use the Bun ecosystem so version PRs update bun.lock together with package.json.
# If the org enables Dependabot for npm_and_yarn on this repo, disable or exclude
# that rule here to avoid PRs that bump package.json without refreshing bun.lock.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # TypeScript 7 is unusable until typescript-eslint supports it: `bun run
    # lint` exits 2 with "typescript-eslint does not support TS 7.0", which
    # took down the whole 44-package group PR. Drop this rule once
    # typescript-eslint ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    target-branch: "master"
